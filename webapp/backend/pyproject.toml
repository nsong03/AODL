[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aodl-studio"
version = "0.1.0"
description = "AODL Studio backend: FastAPI service and advanced FFT engine on top of the aodl package"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # `aodl` is installed editable from the repository root:
    #     pip install -e ../.. -e .[dev]        (from webapp/backend)
    "aodl",
    "fastapi>=0.110",
    "uvicorn[standard]",
    "numpy",
    "scipy>=1.8",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aodl_webapp*", "aodl_advanced*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["aodl", "aodl_webapp", "aodl_advanced"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/aodl_webapp", "src/aodl_advanced"]
# `aodl` is installed editable from the repository root; resolve it from source rather than
# as an untyped site package (the root package also ships a py.typed marker).
mypy_path = "../../src"

[[tool.mypy.overrides]]
module = ["scipy.*", "imageio.*", "matplotlib.*"]
ignore_missing_imports = true
