[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aodl"
version = "0.1.0"
description = "Waveform synthesis and closed-form optical simulation for a 3D acousto-optic deflector lens (AODL)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "jupyterlab",
    "nbmake",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/aodl"]

# Third-party scientific packages ship partial or no type information; the gate is on our
# own code, not on their stubs.  Scoped per package rather than set globally, so a typo in
# an `aodl.` import is still an error.
[[tool.mypy.overrides]]
module = ["scipy.*", "imageio.*", "matplotlib.*"]
ignore_missing_imports = true
