[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aodl"
version = "0.1.0"
description = "Waveform synthesis and closed-form optical simulation for a 3D acousto-optic deflector lens (AODL)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "jupyterlab",
    "nbmake",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
